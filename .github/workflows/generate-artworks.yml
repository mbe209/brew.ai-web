name: Artworks mit Nano Banana erzeugen

# Manuell starten: Actions → "Artworks mit Nano Banana erzeugen" → Run workflow.
# Braucht das Actions-Secret GEMINI_API_KEY. Die Bilder landen als Pull Request im Repo.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Nur diese IDs (kommagetrennt, z. B. 01-hero,06-sorte-1). Leer = alle fehlenden"
        required: false
        default: ""
      force:
        description: "Vorhandene Bilder neu erzeugen"
        type: boolean
        default: false
      model:
        description: "Gemini-Bildmodell"
        required: false
        default: "gemini-2.5-flash-image"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebP-Tools installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q webp
      - name: Artworks erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ inputs.model }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          set -- 
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          [ "$FORCE" = "true" ] && set -- "$@" --force
          node scripts/generate-artworks.mjs "$@"
      - name: Pull Request mit den Bildern öffnen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain public/art)" ]; then
            echo "Keine neuen Bilder."
            exit 0
          fi
          branch="artworks/run-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/art
          git commit -m "Artworks mit Nano Banana erzeugt"
          git push -u origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "Neue Artworks (Nano Banana)" \
            --body "Automatisch erzeugt mit \`${{ inputs.model }}\`. Bitte Bilder prüfen und nur gute Varianten mergen." \
            || echo "::warning::PR konnte nicht erstellt werden (Settings → Actions → 'Allow GitHub Actions to create pull requests'). Branch $branch ist gepusht."
